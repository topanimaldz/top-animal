<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Animal | متجر الحيوانات الأليفة</title>
<style>
:root{--green:#5faa35;--dark:#173d22;--soft:#eaf7df}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f7fff3;color:var(--dark)}
header{position:sticky;top:0;z-index:20;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 5%;box-shadow:0 2px 10px #0002}
.logo{height:58px}.cart{border:0;background:var(--green);color:#fff;border-radius:25px;padding:11px 16px;font-size:16px;font-weight:bold}.badge{background:#fff;color:var(--green);border-radius:50%;padding:2px 7px}
.hero{text-align:center;padding:40px 6%;background:linear-gradient(135deg,#efffdf,#fff)}.hero img{width:min(330px,80%)}.hero h1{font-size:clamp(34px,8vw,55px);margin:8px}.hero p{font-size:20px;line-height:1.8}
section{padding:35px 6%}h2{text-align:center;font-size:30px}.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;max-width:1000px;margin:auto}
.cat{background:#fff;border:2px solid var(--soft);border-radius:20px;padding:20px 10px;text-align:center;font-size:19px;font-weight:bold;cursor:pointer;box-shadow:0 3px 12px #0001}.cat span{display:block;font-size:48px;margin-bottom:8px}
.subcats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;max-width:1000px;margin:20px auto}.sub{background:var(--soft);border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}.card{background:#fff;border-radius:18px;padding:15px;text-align:center;box-shadow:0 3px 15px #0001}.pic{height:160px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:65px}.card h3{margin:12px 0 7px}.price{color:var(--green);font-weight:bold;margin:8px}.add{width:100%;border:0;background:var(--green);color:#fff;padding:12px;border-radius:11px;font-weight:bold;font-size:16px}
.back{display:none;margin:0 auto 20px;border:0;background:#eee;border-radius:10px;padding:10px 16px;font-weight:bold}.note{text-align:center;color:#666}footer{background:var(--dark);color:#fff;text-align:center;padding:25px}
.panel{position:fixed;inset:0;background:#0008;z-index:50;display:none}.box{background:#fff;position:absolute;right:0;top:0;width:min(430px,92%);height:100%;padding:20px;overflow:auto}.close{float:left;border:0;padding:8px;border-radius:8px}.item{display:flex;gap:8px;align-items:center;border-bottom:1px solid #ddd;padding:14px 0}.info{flex:1}.qty button{border:0;background:var(--soft);padding:5px 10px;border-radius:7px;font-size:18px}.total{font-size:21px;font-weight:bold;margin:20px 0}.wa{display:block;background:#25d366;color:#fff;text-decoration:none;text-align:center;padding:14px;border-radius:12px;font-weight:bold}
</style>
</head>
<body>
<header>
<img src="logo.jpg" class="logo" alt="Top Animal">
<button class="cart" onclick="openCart()">🛒 السلة <span class="badge" id="count">0</span></button>
</header>

<section class="hero">
<img src="logo.jpg" alt="Top Animal">
<h1>Top Animal</h1>
<p>كل ما يحتاجه حيوانك الأليف في مكان واحد 🐾</p>
</section>

<section id="store">
<h2>🛍️ أقسام المتجر</h2>
<div class="categories" id="categories">
<div class="cat" onclick="showCategory('cats')"><span>🐱</span>القطط</div>
<div class="cat" onclick="showCategory('dogs')"><span>🐶</span>الكلاب</div>
<div class="cat" onclick="showCategory('birds')"><span>🐦</span>الطيور</div>
<div class="cat" onclick="showCategory('fish')"><span>🐠</span>الأسماك</div>
<div class="cat" onclick="showOffers()"><span>🔥</span>العروض</div>
</div>

<div id="inside" style="display:none">
<button class="back" id="back" onclick="backHome()">← العودة إلى الأقسام</button>
<h2 id="catTitle"></h2>
<div class="subcats" id="subcats"></div>
<div class="products" id="products"></div>
<p class="note">يمكن إضافة عدد كبير من المنتجات في كل قسم.</p>
</div>
</section>

<footer>© 2026 Top Animal — مستلزمات الحيوانات الأليفة</footer>

<div class="panel" id="panel" onclick="if(event.target===this)closeCart()">
<div class="box"><button class="close" onclick="closeCart()">✕</button><h2>🛒 السلة</h2><div id="items"></div><div class="total" id="total">المجموع: 0 دج</div><a class="wa" id="wa" href="#" target="_blank">📱 إرسال الطلب عبر واتساب</a></div>
</div>

<script>
const data={
cats:{title:'🐱 القطط',subs:['🍗 أكل القطط','🧴 مستلزمات العناية','🏠 بيوت وأماكن النوم','🪀 ألعاب القطط','🪣 رمل القطط','🍽️ أوعية ومشارب','🦺 أطواق وأحزمة','🎒 حوامل ونقل القطط']},
dogs:{title:'🐶 الكلاب',subs:['🍗 أكل الكلاب','🧴 العناية والنظافة','🪀 الألعاب','🍽️ الأوعية والمشارب','🦮 الأطواق والأحزمة والمقاود','🏠 بيوت وإكسسوارات','🎒 النقل']},
birds:{title:'🐦 الطيور',subs:['🌾 أكل الطيور','🏠 الأقفاص','🍽️ أوعية ومشارب','🪹 أعشاش ولوازم التفريخ','🧸 ألعاب وإكسسوارات','🧴 العناية']},
fish:{title:'🐠 الأسماك',subs:['🥫 أكل الأسماك','🏠 الأحواض','💧 معالجة وتجهيز المياه','⚙️ الفلاتر والمضخات','💡 الإضاءة والتجهيزات','🌿 ديكور ونباتات']}
};
let cart=[];
function showCategory(key){
categories.style.display='none';inside.style.display='block';back.style.display='block';catTitle.textContent=data[key].title;
subcats.innerHTML=data[key].subs.map(x=>`<button class="sub" onclick="showProducts('${x}')">${x}</button>`).join('');
products.innerHTML='<p class="note">اختر قسمًا فرعيًا لعرض المنتجات.</p>';store.scrollIntoView({behavior:'smooth'});
}
function showProducts(name){
products.innerHTML=[1,2,3,4].map(x=>`<article class="card"><div class="pic">🐾</div><h3>${name}</h3><div class="price">السعر عند الطلب</div><button class="add" onclick="add('${name} ${x}',0)">أضف إلى السلة 🛒</button></article>`).join('');
}
function showOffers(){categories.style.display='none';inside.style.display='block';back.style.display='block';catTitle.textContent='🔥 العروض';subcats.innerHTML='';showProducts('منتج في العرض')}
function backHome(){categories.style.display='grid';inside.style.display='none'}
function add(name,price){let x=cart.find(a=>a.name===name);x?x.qty++:cart.push({name,price,qty:1});update();openCart()}
function change(i,n){cart[i].qty+=n;if(cart[i].qty<1)cart.splice(i,1);update()}
function update(){
count.textContent=cart.reduce((s,x)=>s+x.qty,0);
items.innerHTML=cart.length?cart.map((x,i)=>`<div class="item"><div class="info"><b>${x.name}</b><br>${x.price?x.price+' دج':'السعر عند الطلب'}</div><div class="qty"><button onclick="change(${i},1)">+</button> ${x.qty} <button onclick="change(${i},-1)">−</button></div></div>`).join(''):'<p class="note">السلة فارغة.</p>';
let t=cart.reduce((s,x)=>s+x.price*x.qty,0);total.textContent=t?'المجموع: '+t.toLocaleString('ar-DZ')+' دج':'المجموع: يُحدد حسب المنتجات';
let msg='السلام عليكم، أريد طلب:%0A'+cart.map(x=>'• '+x.name+' × '+x.qty+(x.price?' — '+x.price*x.qty+' دج':' — السعر عند الطلب')).join('%0A')+(t?'%0Aالمجموع: '+t+' دج':'%0Aأرجو تأكيد الأسعار والتوفر.');
wa.href='https://wa.me/2130773706022?text='+encodeURIComponent(decodeURIComponent(msg));
}
function openCart(){panel.style.display='block';update()}function closeCart(){panel.style.display='none'}update();
</script>
</body>
</html>
